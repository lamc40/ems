<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}联通用户管理系统{% endblock %}</title>
    <!-- Bootstrap 3 样式（CDN） -->
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/3.4.1/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar { margin-bottom: 0; }
    </style>
    {% block css %}{% endblock %}    {# 子页面可扩展自定义样式 #}
</head>
<body>
<!-- 顶部导航栏 -->
<nav class="navbar navbar-default">
    <div class="container-fluid">
        <!-- 左侧：系统名称 -->
        <div class="navbar-header">
            <a class="navbar-brand" href="/depart/list/">联通用户管理系统</a>
        </div>
        <div class="collapse navbar-collapse">
            <!-- 中间：模块菜单 -->
            <ul class="nav navbar-nav">
                <li class="active"><a href="/depart/list/">部门管理</a></li>
                <li><a href="/user/list/">用户管理</a></li>
                <li><a href="/pretty/list/">靓号管理</a></li>
                <li><a href="#">Link</a></li>
            </ul>
            <!-- 右侧：登录与用户下拉菜单 -->
            <ul class="nav navbar-nav navbar-right">
                <li><a href="#">登录</a></li>
                <li class="dropdown">
                    <a href="#" class="dropdown-toggle" data-toggle="dropdown">郭栋梁 <span class="caret"></span></a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- 主内容区：子页面通过 block content 填充 -->
<div class="container" style="margin-top: 20px;">
    {% block content %}{% endblock %}
</div>

<!-- jQuery + Bootstrap JS（dropdown等组件依赖jQuery） -->
<script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/3.4.1/js/bootstrap.min.js"></script>
{% block js %}{% endblock %}    {# 子页面可扩展自定义脚本 #}
</body>
</html>
