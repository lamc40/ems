{% extends 'layout.html' %}
{% block content %}
<div class="container col-md-6 col-md-offset-3">
    <h3>编辑薪资 —— {{ salary.employee.name }} {{ salary.month }}</h3>
    <form method="post" class="form-horizontal">
        {% csrf_token %}
        <div class="form-group">
            <label class="col-sm-3 control-label">基本工资</label>
            <div class="col-sm-8"><input type="number" step="0.01" name="base_salary" class="form-control" value="{{ salary.base_salary }}"></div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">奖金</label>
            <div class="col-sm-8"><input type="number" step="0.01" name="bonus" class="form-control" value="{{ salary.bonus }}"></div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">扣款</label>
            <div class="col-sm-8"><input type="number" step="0.01" name="deduction" class="form-control" value="{{ salary.deduction }}"></div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">备注</label>
            <div class="col-sm-8"><input type="text" name="remark" class="form-control" value="{{ salary.remark }}"></div>
        </div>
        <div class="form-group">
            <div class="col-sm-offset-3 col-sm-8">
                <button type="submit" class="btn btn-primary">保存（实发自动重算）</button>
                <a href="/salary/list/" class="btn btn-default">返回</a>
            </div>
        </div>
    </form>
</div>
{% endblock %}
