{% extends 'layout.html' %}
{% block content %}
<div class="container col-md-6 col-md-offset-3">
    <h3>录入薪资</h3>
    <form method="post" class="form-horizontal">
        {% csrf_token %}
        <div class="form-group">
            <label class="col-sm-3 control-label">员工</label>
            <div class="col-sm-8">
                <select name="employee" class="form-control">
                    {% for e in employees %}<option value="{{ e.id }}">{{ e.name }}</option>{% endfor %}
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">月份</label>
            <div class="col-sm-8"><input type="month" name="month" class="form-control" required></div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">基本工资</label>
            <div class="col-sm-8"><input type="number" step="0.01" name="base_salary" class="form-control" value="0"></div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">奖金</label>
            <div class="col-sm-8"><input type="number" step="0.01" name="bonus" class="form-control" value="0"></div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">扣款</label>
            <div class="col-sm-8"><input type="number" step="0.01" name="deduction" class="form-control" value="0"></div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">备注</label>
            <div class="col-sm-8"><input type="text" name="remark" class="form-control"></div>
        </div>
        <div class="form-group">
            <div class="col-sm-offset-3 col-sm-8">
                <button type="submit" class="btn btn-primary">提交（实发自动计算）</button>
                <a href="/salary/list/" class="btn btn-default">返回</a>
            </div>
        </div>
    </form>
</div>
{% endblock %}
