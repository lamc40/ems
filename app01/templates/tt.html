{% extends 'layout.html' %}

{% block content %}
    <div class="container">
        <div class="panel panel-default">
            <div class="panel-heading"><h3 class="panel-title">头像预览示例</h3></div>
            <div class="panel-body">
                <form method="post" enctype="multipart/form-data" novalidate>
                    {% csrf_token %}
                    <div style="height: 100px;width: 100px;padding: 2px;border: 1px solid #ddd;position: relative;margin-bottom: 15px;">
                        <img style="height: 100%;width: 100%;border: 0;" id="previewImg" src="/static/img/default.png">
                        <input style="top: 0;left: 0;right: 0;bottom: 0;opacity: 0;position: absolute;z-index: 102;"
                               id="avatarImg" name="image" type="file">
                    </div>

                    {% for field in form %}
                        {% if field.name != 'image' %}
                            <div class="form-group">
                                <label>{{ field.label }}</label>
                                {{ field }}
                                <span style="color: red;">{{ field.errors.0 }}</span>
                            </div>
                        {% endif %}
                    {% endfor %}
                    <button type="submit" class="btn btn-primary">提 交</button>
                </form>
            </div>
        </div>
    </div>
{% endblock %}

{% block js %}
    <script>
        $(function () {
            $('#avatarImg').change(function () {
                var file_obj = $(this)[0].files[0];
                if (!file_obj) return;
                var reader = new FileReader();
                reader.readAsDataURL(file_obj);
                reader.onload = function (e) { $('#previewImg')[0].src = this.result; }
            })
        });
    </script>
{% endblock %}
