{% extends 'layout.html' %}
{% block content %}
<div class="container col-md-6 col-md-offset-3">
    <h3>编辑考勤 —— {{ attendance.employee.name }}</h3>
    <form method="post" class="form-horizontal">
        {% csrf_token %}
        <div class="form-group">
            <label class="col-sm-3 control-label">员工</label>
            <div class="col-sm-8">
                <select name="employee" class="form-control">
                    {% for e in employees %}
                    <option value="{{ e.id }}" {% if e.id == attendance.employee_id %}selected{% endif %}>{{ e.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">日期</label>
            <div class="col-sm-8"><input type="date" name="date" value="{{ attendance.date }}" class="form-control"></div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">上班时间</label>
            <div class="col-sm-8"><input type="time" name="morning_time" value="{{ attendance.morning_time|default:'' }}" class="form-control"></div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">下班时间</label>
            <div class="col-sm-8"><input type="time" name="evening_time" value="{{ attendance.evening_time|default:'' }}" class="form-control"></div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">备注</label>
            <div class="col-sm-8"><input type="text" name="remark" value="{{ attendance.remark }}" class="form-control"></div>
        </div>
        <div class="form-group">
            <div class="col-sm-offset-3 col-sm-8">
                <button type="submit" class="btn btn-primary">保存（状态自动计算）</button>
                <a href="/attendance/list/" class="btn btn-default">返回</a>
            </div>
        </div>
    </form>
</div>
{% endblock %}
