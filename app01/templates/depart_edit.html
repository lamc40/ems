{% extends 'layout.html' %}

{% block title %}编辑部门 - 联通用户管理系统{% endblock %}

{% block content %}
    <div class="panel panel-default">
        <div class="panel-heading">编辑部门</div>
        <div class="panel-body">
            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label>部门名称</label>
                    <input type="text" name="title" class="form-control" value="{{ depart.title }}" required>
                </div>
                <button type="submit" class="btn btn-primary">保存</button>
                <a href="/depart/list/" class="btn btn-default">返回</a>
            </form>
        </div>
    </div>
{% endblock %}
