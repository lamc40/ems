<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>登录 - EMS 企业员工管理系统</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/3.4.1/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f5f5f5; }
        .login-box {
            width: 360px;
            margin: 100px auto;
            padding: 30px;
            background: #fff;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .login-box h3 { text-align: center; margin-bottom: 25px; }
        .code-row { display: flex; gap: 8px; }
        .code-row input { flex: 1; }
        .code-row img { cursor: pointer; border-radius: 3px; border: 1px solid #ddd; height: 34px; }
    </style>
</head>
<body>
<div class="login-box">
    <h3>EMS 企业员工管理系统</h3>
    <form method="post" novalidate>
        {% csrf_token %}
        <div class="form-group">
            <label>用户名</label>
            <input type="text" name="username" class="form-control" placeholder="请输入用户名" autofocus>
        </div>
        <div class="form-group">
            <label>密码</label>
            <input type="password" name="password" class="form-control" placeholder="请输入密码">
        </div>
        <div class="form-group">
            <label>验证码</label>
            <div class="code-row">
                <input type="text" name="code" class="form-control" placeholder="请输入验证码" maxlength="5">
                {# 点击图片切换验证码时间戳防止浏览器缓存 #}
                <img id="code_img" src="/admin/code/" onclick="refreshCode()" title="点击刷新验证码">
            </div>
        </div>
        {% if error %}
        <div class="alert alert-danger" style="padding: 10px; margin-bottom: 15px;">{{ error }}</div>
        {% endif %}
        <button type="submit" class="btn btn-primary btn-block">登 录</button>
    </form>
</div>
<script>
    function refreshCode() {
        // 加随机时间戳让浏览器重新请求，不使用缓存
        document.getElementById('code_img').src = '/admin/code/?t=' + new Date().getTime();
    }
</script>
</body>
</html>
