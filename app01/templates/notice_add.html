{% extends 'layout.html' %}
{% block content %}
<div class="container col-md-8 col-md-offset-2">
    <h3>{{ title|default:"发布公告" }}</h3>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label>标题</label>
            <input type="text" name="title" class="form-control" placeholder="公告标题" value="{{ notice.title|default:'' }}" required>
        </div>
        <div class="form-group">
            <label>内容</label>
            <textarea name="content" class="form-control" rows="8" placeholder="公告内容" required>{{ notice.content|default:'' }}</textarea>
        </div>
        <div class="form-group">
            <label class="checkbox-inline"><input type="checkbox" name="is_top" {% if notice.is_top %}checked{% endif %}> 置顶公告</label>
        </div>
        <button type="submit" class="btn btn-primary">提交</button>
        <a href="/notice/list/" class="btn btn-default">返回</a>
    </form>
</div>
{% endblock %}
